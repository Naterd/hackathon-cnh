{% extends "base.html" %}

{% block content %}
<h1>Photograph a KubeCon slide.</h1>
<p>Get the talk, the speaker and a YouTube link that starts the moment that slide appeared.</p>

<input id="photo" class="visually-hidden" type="file" accept="image/*" capture="environment">
<label class="button" for="photo">Take a photo</label>

<p id="status" aria-live="polite"></p>

<section id="result" aria-labelledby="result-title" hidden>
  <h2 id="result-title"></h2>
  <p id="result-speakers"></p>
  <a id="result-link" class="button"></a>
</section>

<img id="preview" alt="The slide you photographed" hidden>
{% endblock %}
