<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}SlideKick{% endblock %}</title>
  <meta name="theme-color" content="#f2f8f9">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" href="/static/icon-192.png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="preload" href="/static/fonts/familjen-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/style.css?v={{ version }}">
  {% if dash0_web_token %}
  <script>
    window.dash0 = window.dash0 || function () { (window.dash0._q = window.dash0._q || []).push(arguments); };
    dash0("init", {
      serviceName: "slidekick-web",
      endpoint: { url: "https://ingress.us-west-2.aws.dash0.com", authToken: "{{ dash0_web_token }}", dataset: "default" },
      additionalSignalAttributes: { "service.version": "{{ version }}" },
    });
  </script>
  <script src="https://unpkg.com/@dash0/sdk-web@0.30.0/dist/dash0.iife.js" integrity="sha384-cITJaCCgsy3efWq59Bp2ihU/Oh7ckYNOEHPwWoXhcHbGyCVNoEnnjkQaAI0Pzyct" crossorigin="anonymous" defer></script>
  {% endif %}
  <script src="/static/app.js?v={{ version }}" defer></script>
</head>
<body>
  <!-- Lucide icons (ISC license), drawn with <use href="#i-…">. -->
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z"/><circle cx="12" cy="13" r="3"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-cloud-off" viewBox="0 0 24 24"><path d="M10.94 5.274A7 7 0 0 1 15.71 10h1.79a4.5 4.5 0 0 1 4.222 6.057"/><path d="M18.796 18.81A4.5 4.5 0 0 1 17.5 19H9A7 7 0 0 1 5.79 5.78"/><path d="m2 2 20 20"/></symbol>
    <symbol id="i-git-commit-vertical" viewBox="0 0 24 24"><path d="M12 3v6"/><circle cx="12" cy="12" r="3"/><path d="M12 15v6"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></symbol>
    <symbol id="i-images" viewBox="0 0 24 24"><path d="m22 11-1.296-1.296a2.4 2.4 0 0 0-3.408 0L11 16"/><path d="M4 8a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2"/><circle cx="13" cy="7" r="1" fill="currentColor"/><rect x="8" y="2" width="14" height="14" rx="2"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 2v13"/><path d="m16 6-4-4-4 4"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/></symbol>
  </svg>
  {% block content %}{% endblock %}
</body>
</html>
