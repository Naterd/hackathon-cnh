# Deploys deploy/ into namespace slidekick on our GKE cluster. Apply once:
#   kubectl apply -f argocd/project.yaml -f argocd/application-byo.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: slidekick
  namespace: argocd
spec:
  project: slidekick
  source:
    repoURL: https://github.com/Naterd/hackathon-cnh.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: slidekick
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
