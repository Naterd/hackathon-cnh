name: app-ci
# For PRs that touch the app: import it, hit its routes, and build the image the deploy would ship.
on:
  pull_request:
    paths:
      - app/**
      - Dockerfile
      - tests/app_smoke.py
      - tests/fairshare_test.py
      - tests/observability_test.py
      - .github/workflows/app-ci.yaml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r app/requirements.txt httpx
      - name: Smoke test
        working-directory: app
        run: python ../tests/app_smoke.py
      - name: Sessions and fair share
        working-directory: app
        run: python ../tests/fairshare_test.py
      - name: Tracing and lookup telemetry
        working-directory: app
        run: |
          pip install opentelemetry-sdk==1.44.0
          python ../tests/observability_test.py
      - name: Build the image
        run: docker build --build-arg APP_VERSION=ci -t slidekick-app:ci .
