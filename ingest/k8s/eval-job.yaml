# The random accuracy test (ingest/eval.py) as one pod on the spot pool. Rendered by ingest/run.sh.
apiVersion: batch/v1
kind: Job
metadata:
  name: ingest-eval__SUFFIX__
  namespace: ingest
  labels: {app: ingest, step: eval, purpose: cnh-hackathon, app.kubernetes.io/name: slidekick-ingest, app.kubernetes.io/version: "__VERSION__"}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app: ingest, step: eval, app.kubernetes.io/name: slidekick-ingest, app.kubernetes.io/version: "__VERSION__"}
      annotations: {gke-gcsfuse/volumes: "true"}
    spec:
      restartPolicy: Never
      serviceAccountName: downloader
      nodeSelector: {workload: ingest}
      tolerations: [{key: workload, operator: Equal, value: ingest, effect: NoSchedule}]
      containers:
        - name: eval
          image: __IMAGE__
          command: ["sh", "-c", "exec python -u /code/eval.py --videos /bucket/__EVENT__ --derived /bucket/derived/__DERIVED__/__EVENT__ --index __INDEX__ --n __N__ --seed __SEED__ --workers 6 --save-failures /bucket/eval/__RUN__ __ARGS__"]
          envFrom: [{secretRef: {name: elastic}}]
          resources:
            requests: {cpu: "6", memory: 6Gi}
            limits: {cpu: "7", memory: 10Gi}
          volumeMounts:
            - {name: bucket, mountPath: /bucket}
            - {name: code, mountPath: /code}
      volumes:
        - name: bucket
          csi:
            driver: gcsfuse.csi.storage.gke.io
            volumeAttributes: {bucketName: __BUCKET__, mountOptions: "implicit-dirs,uid=1000,gid=1000"}
        - name: code
          configMap: {name: ingest-code__SUFFIX__}
