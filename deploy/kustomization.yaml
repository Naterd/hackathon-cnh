# Argo CD deploys this folder to namespace slidekick. The GitHub Action
# sets the image below on every push to main; don't edit newName or newTag
# by hand.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: slidekick
resources:
  - deployment.yaml
  - service.yaml
  - backendconfig.yaml
images:
  - name: app
    newName: ghcr.io/naterd/hackathon-cnh
    newTag: afe2c72
