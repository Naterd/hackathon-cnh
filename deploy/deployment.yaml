apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app
spec:
  # Remove this line when you turn on the HPA (examples/hpa), or Argo CD and
  # the autoscaler will keep resetting each other.
  replicas: 2
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
        # Dash0 takes the service name from these.
        app.kubernetes.io/name: slidekick
        app.kubernetes.io/part-of: slidekick
    spec:
      # The app never calls the Kubernetes API.
      automountServiceAccountToken: false
      # Soft: the default pool can be a single node.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: app
      containers:
        - name: app
          image: app
          ports:
            - name: http
              containerPort: 8080
          # ELASTIC_URL and ELASTIC_ES_API_KEY, kept out of git.
          envFrom:
            - secretRef:
                name: app-credentials
          # The OCR models take 300-500 MB, and OCR is most of a lookup's CPU.
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
